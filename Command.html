<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHO MAFIAS | COMMAND & CONTROL</title>
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto+Mono:wght@300;500&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --primary-gold: #d4af37;
            --danger-red: #ff0033;
            --verify-green: #00ff88;
            --matrix-color: rgba(212, 175, 55, 0.15);
            --bg-white: #f0f2f5;
            --card-dark: #0a0a0a;
            --cyber-blue: #00d4ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Roboto Mono', monospace;
            background: var(--bg-white);
            color: #333;
            overflow-x: hidden;
            transition: 0.5s;
        }

        /* --- Header & Navigation --- */
        header {
            background: #000;
            padding: 15px 0;
            text-align: center;
            border-bottom: 3px solid var(--primary-gold);
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            color: var(--primary-gold);
            letter-spacing: 4px;
            font-size: 1.5rem;
            text-transform: uppercase;
        }

        .dashboard-nav {
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            padding: 10px;
            gap: 10px;
            border-bottom: 1px solid #333;
        }

        .nav-btn {
            background: #222;
            border: 1px solid var(--primary-gold);
            color: #fff;
            padding: 8px 15px;
            font-size: 0.75rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            font-family: 'Orbitron', sans-serif;
        }

        .nav-btn:hover {
            background: var(--primary-gold);
            color: #000;
            box-shadow: 0 0 15px var(--primary-gold);
        }

        /* Mobile Menu */
        .burger-menu {
            display: none;
            color: var(--primary-gold);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 10px;
        }

        @media (max-width: 768px) {
            .dashboard-nav { display: none; }
            .dashboard-nav.active { display: flex; flex-direction: column; width: 100%; }
            .burger-menu { display: block; background: #000; text-align: right; }
        }

        /* --- Search Area --- */
        .search-section {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }

        .search-input-wrapper {
            position: relative;
            display: flex;
            background: #fff;
            border: 2px solid #000;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 10px 10px 0px #000;
        }

        .search-input-wrapper input {
            flex: 1;
            padding: 15px;
            border: none;
            outline: none;
            font-size: 1.1rem;
            font-family: 'Orbitron', sans-serif;
        }

        .search-input-wrapper button {
            background: #000;
            color: var(--primary-gold);
            padding: 0 30px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        /* --- Ultra Premium Card Design --- */
        #display-area {
            display: flex;
            justify-content: center;
            padding: 20px;
            perspective: 2000px;
        }

        .card-container {
    width: 100%;
    max-width: 950px;
    height: 550px; /* Ek fixed height lazmi den */
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: default;
}

/* Jab card flip ho toh 180 degree ghume */
        .card-container.flipped { transform: rotateY(180deg); }

        .card-front, .card-back {
            width: 100%;
            background: var(--card-dark);
            border-radius: 20px;
            padding: 40px;
            color: white;
            backface-visibility: hidden;
            position: relative;
            overflow: hidden;
            border: 2px solid #333;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
.card-front { z-index: 2; transform: rotateY(0deg); }

        .card-back {
            position: absolute;
            top: 0; left: 0;
            transform: rotateY(180deg);
            height: 100%;
            background: #050505;
            
        }

        /* Matrix Animation Background */
        .matrix-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.3;
        }

        /* Hologram Shine */
        .hologram {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, transparent 20%, rgba(255,255,255,0.1) 50%, transparent 80%);
            z-index: 5;
            pointer-events: none;
        }

        /* Card Layout */
        .card-inner {
            position: relative;
            z-index: 10;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 40px;
        }

        /* Left Side: Profile */
        .profile-box {
            text-align: center;
            position: relative;
        }

        .img-wrapper {
            position: relative;
            width: 250px;
            height: 300px;
            margin: 0 auto;
            border: 2px solid var(--primary-gold);
            overflow: hidden;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }

        /* Biometric Scanner Animation */
        .scanner-line {
            position: absolute;
            width: 100%;
            height: 4px;
            background: var(--cyber-blue);
            box-shadow: 0 0 15px var(--cyber-blue);
            top: 0;
            z-index: 100;
            animation: scan 3s infinite linear;
        }

        @keyframes scan {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }

        /* Status Stamps */
        .stamp {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(-30deg);
            font-size: 4rem;
            font-weight: 900;
            padding: 10px 30px;
            border: 10px solid;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: 0.5s;
        }

        .status-active .stamp-verified { opacity: 0.3; color: var(--verify-green); border-color: var(--verify-green); }
        .status-lefted .stamp-terminated { opacity: 0.6; color: var(--danger-red); border-color: var(--danger-red); }
        .status-lefted .profile-img { filter: grayscale(1); }
        .status-lefted.card-front { filter: grayscale(0.8); border-color: #555; }

        /* Right Side: Data */
        .info-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--primary-gold);
            padding-bottom: 10px;
        }

        .info-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: var(--primary-gold);
        }

        .directorate-tag {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 3px;
            font-weight: bold;
        }
        .dir-verify { background: var(--verify-green); color: #000; }
        .dir-not-verify { background: #000; color: #fff; border: 1px solid #fff; }

        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .data-item {
            border-bottom: 1px solid #222;
            padding-bottom: 5px;
        }

        .label { color: #888; font-size: 0.7rem; text-transform: uppercase; display: block; }
        .value { color: #fff; font-size: 0.95rem; font-weight: 500; }

        /* Security Features */
        .security-footer {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .qr-box canvas { width: 80px !important; height: 80px !important; border: 2px solid #fff; }

        .signature {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: #ddd;
            border-bottom: 1px solid #444;
        }

        .pulse-box {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.7rem;
            color: var(--cyber-blue);
        }

        .pulse-dot {
            width: 8px; height: 8px;
            background: var(--cyber-blue);
            border-radius: 50%;
            animation: pulse-ani 1.5s infinite;
        }

        @keyframes pulse-ani {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        /* Action Buttons */
        .btn-group {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: transparent;
            border: 1px solid var(--primary-gold);
            color: var(--primary-gold);
            padding: 8px 15px;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: 'Orbitron', sans-serif;
        }

        .action-btn:hover { background: var(--primary-gold); color: #000; }

        /* Mission List on Back */
        .mission-list {
            list-style: none;
            margin-top: 20px;
        }

        .mission-list li {
            background: rgba(255,0,0,0.1);
            border-left: 4px solid var(--danger-red);
            padding: 15px;
            margin-bottom: 10px;
            font-size: 0.9rem;
            animation: slideUp 0.5s ease forwards;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Code Rain Animation at bottom */
        .coding-lines {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            height: 30px;
            background: rgba(0,0,0,0.5);
            color: var(--primary-gold);
            font-size: 10px;
            white-space: nowrap;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .coding-scroll {
            display: inline-block;
            animation: scroll-text 10s linear infinite;
        }

        @keyframes scroll-text {
            from { transform: translateX(100%); }
            to { transform: translateX(-100%); }
        }

        @media (max-width: 850px) {
            .card-inner { grid-template-columns: 1fr; }
            .data-grid { grid-template-columns: 1fr; }
        }

        /* Card Shake/Reload Animation */
@keyframes cardReload {
    0% { transform: rotateY(180deg) scale(1); }
    25% { transform: rotateY(185deg) scale(0.98) translateX(5px); }
    50% { transform: rotateY(175deg) scale(1.02) translateX(-5px); }
    75% { transform: rotateY(182deg) scale(0.99) translateX(3px); }
    100% { transform: rotateY(180deg) scale(1); }
}

.reloading {
    animation: cardReload 0.4s ease-in-out !important;
}
    </style>
</head>
<body>

    <header>
        <h1>WHO MAFIAS COMMAND & CONTROL</h1>
    </header>

    <div class="burger-menu" onclick="toggleNav()">
        <i class="fas fa-bars"></i>
    </div>

    <nav class="dashboard-nav" id="mainNav">
        <button class="nav-btn" onclick="window.location.href='AdminPane.html'"> Edit Products</button>
        <button class="nav-btn" onclick="window.location.href='Comments.html'"> All Comments</button>
        <button class="nav-btn" onclick="window.location.href='High-Command.html'"> High Command Panel</button>

    </nav>

    <section class="search-section">
        <div class="search-input-wrapper">
            <input type="text" id="agentIdInput" placeholder="ENTER AGENT ID (e.g. WM-123456)">
            <button onclick="searchAgent()"><i class="fas fa-satellite-dish"></i> SEARCH</button>
        </div>
    </section>

    <main id="display-area">
        <!-- The Card will be injected here via JavaScript -->
    </main>

    <script>
        // --- CONFIGURATION ---
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxHAIz4JiiRQWoIlEKfeNQnqYiL3ZHrD95lTR3cqRKIuk6syRk_u2E1JKsVgTfObFP4/exec'; // Replace with your Apps Script URL

        async function searchAgent() {
            const id = document.getElementById('agentIdInput').value.trim();
            if(!id) return alert("Please enter a UserID");

            document.getElementById('display-area').innerHTML = "<h2 style='color:#000'>ESTABLISHING SECURE LINK...</h2>";

            try {
                const response = await fetch(`${WEB_APP_URL}?action=getUser&id=${id}`);
                const data = await response.json();

                if (data.status === "error") {
                    document.getElementById('display-area').innerHTML = "<h2 style='color:red'>AGENT NOT FOUND IN DATABASE</h2>";
                } else {
                    renderAgentCard(data.user);
                }
            } catch (err) {
                console.error(err);
                alert("Connection failed. Ensure Apps Script URL is correct and deployed.");
            }
        }

        function reloadAndFlip() {
    const card = document.getElementById('cardCont');
    if (card) {
        // 1. Pehle Reloading/Shake class add karein
        card.classList.add('reloading');
        
        // 2. 400ms ke baad (jab animation khatam ho) flip karein
        setTimeout(() => {
            card.classList.remove('flipped'); // Front side par le aaye
            card.classList.remove('reloading'); // Class remove karein taaki dubara use ho sake
        }, 400);
    }
}

        function renderAgentCard(user) {
            const displayArea = document.getElementById('display-area');
            const isActive = user.Status.toLowerCase() === 'active';
            const isVerified = user.Directorate.toLowerCase() === 'verify';

            displayArea.innerHTML = `
                <div class="card-container" id="cardCont">
                    <!-- FRONT SIDE -->
                    <div class="card-front ${isActive ? 'status-active' : 'status-lefted'}">
                        <canvas class="matrix-bg" id="matrixCanvas"></canvas>
                        <div class="hologram"></div>
                        <div class="scanner-line"></div>
                        <div class="stamp stamp-verified">VERIFIED</div>
                        <div class="stamp stamp-terminated">TERMINATED</div>

                        <div class="card-inner">
                            <div class="profile-box">
                                <div class="img-wrapper">
                                    <img src="${user.Image}" class="profile-img" id="profImg">
                                </div>
                                <div style="background:var(--primary-gold); color:#000; font-weight:900; margin-top:10px; font-size:0.8rem;">
                                    CLEARANCE LEVEL: ${user.Level}
                                </div>
                                <div class="pulse-box" style="margin-top:15px; justify-content:center;">
                                    <div class="pulse-dot"></div>
                                    <span id="liveClock">00:00:00</span>
                                </div>
                            </div>

                            <div class="info-side">
                                <div class="info-header">
                                    <div>
                                        <h2>${user.Name}</h2>
                                        <small style="color:var(--cyber-blue)">ID: ${user.UserID} | DOC: ${user.DocumentID}</small>
                                    </div>
                                    <span class="directorate-tag ${isVerified ? 'dir-verify' : 'dir-not-verify'}">
                                        ${isVerified ? 'DIRECTORATE VERIFIED' : 'NOT VERIFIED'}
                                    </span>
                                </div>

                                <div class="data-grid">
                                    <div class="data-item">
                                        <span class="label">Date of Birth</span>
                                        <span class="value">${user.DOB}</span>
                                    </div>
                                    <div class="data-item">
                                        <span class="label">Nationality</span>
                                        <span class="value">${user.Nationality}</span>
                                    </div>
                                    <div class="data-item">
                                        <span class="label">Identity (CNIC)</span>
                                        <span class="value decryptable" data-real="${user.CNIC}">**********</span>
                                    </div>
                                    <div class="data-item">
                                        <span class="label">Contact</span>
                                        <span class="value decryptable" data-real="${user.Contact}">**********</span>
                                    </div>
                                    <div class="data-item" style="grid-column: span 2">
                                        <span class="label">Primary Address</span>
                                        <span class="value">${user.Address}</span>
                                    </div>
                                </div>

                                <div style="margin-top:15px;">
                                    <span class="label">Briefing / About</span>
                                    <p style="font-size:0.8rem; line-height:1.4; color:#ccc;">${user.About}</p>
                                </div>

                                <div class="security-footer">
                                    <div id="qrcode" class="qr-box"></div>
                                    <div class="signature">${user.Name}</div>
                                </div>

                                <div class="btn-group">
                                    <button class="action-btn" onclick="toggleDecrypt()">DECRYPT DATA</button>
                                    <button class="action-btn" onclick="flipCard()">MISSION ARCHIVES</button>
                                    <button class="action-btn" onclick="downloadImage('${user.Image}')">SAVE PROFILE</button>
                                    ${user.AIVoice === 'AI' ? `<button class="action-btn" onclick="aiSpeak('${user.Name}', '${user.Status}')"><i class="fas fa-play"></i> AI VOICE</button>` : ''}
                                </div>
                            </div>
                        </div>

                        <div class="coding-lines">
                            <div class="coding-scroll">
                                >> LOADING AGENT_DATA... ENCRYPT_LAYER_7... SYSTEM_MONITOR_ACTIVE... BROADCASTING_ID_${user.UserID}... BYPASSING_FIREWALL... ACCESS_GRANTED...
                            </div>
                        </div>
                    </div>

                    <!-- BACK SIDE -->
                    <div class="card-back">
                        <div class="matrix-bg" id="matrixCanvasBack">
                            </div>
                        <h2 style="color:var(--primary-gold); border-bottom:1px solid var(--primary-gold); font-family:'Orbitron'">MISSION HISTORY</h2>
                        <ul class="mission-list">
                            ${user.Missions.split(',').map(m => `<li><i class="fas fa-skull"></i> OPERATION: ${m.trim()}</li>`).join('')}
                        </ul>
                        <button class="action-btn" style="margin-top:20px" onclick="flipCard()">RETURN TO PROFILE</button>
                    </div>
                </div>
                
            `;
            // Start Scripts for Card Features
            startLiveClock();
            initMatrix();
            generateQR(user.UserID + " | " + user.Status);
        }

        // --- Interactive Functions ---

        function toggleNav() {
            document.getElementById('mainNav').classList.toggle('active');
        }

        function flipCard() {
            document.getElementById('cardCont').classList.toggle('flipped');
        }

        function toggleDecrypt() {
            const items = document.querySelectorAll('.decryptable');
            items.forEach(el => {
                if(el.innerText.includes('***')) {
                    el.innerText = el.getAttribute('data-real');
                    el.style.color = 'var(--cyber-blue)';
                } else {
                    el.innerText = '**********';
                    el.style.color = '#fff';
                }
            });
        }

        function startLiveClock() {
            setInterval(() => {
                const el = document.getElementById('liveClock');
                if(el) el.innerText = new Date().toLocaleTimeString();
            }, 1000);
        }

        function generateQR(text) {
            new QRCode(document.getElementById("qrcode"), {
                text: text,
                width: 80,
                height: 80,
                colorDark : "#000000",
                colorLight : "#ffffff"
            });
        }

        function aiSpeak(name, status) {
            const speech = new SpeechSynthesisUtterance(`Agent ${name}. Status ${status}. Directorate Verified. Accessing Mission Archives.`);
            window.speechSynthesis.speak(speech);
        }

        function downloadImage(url) {
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Agent_Profile.jpg';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // Matrix Rain on Card
        function initMatrix() {
            const canvas = document.getElementById('matrixCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 950; canvas.height = 500;
            const letters = "WHO-MAFIAS-1010110";
            const fontSize = 10;
            const columns = canvas.width / fontSize;
            const drops = [];
            for (let i = 0; i < columns; i++) drops[i] = 1;

            function draw() {
                ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#d4af37";
                ctx.font = fontSize + "px Roboto Mono";
                for (let i = 0; i < drops.length; i++) {
                    const text = letters.charAt(Math.floor(Math.random() * letters.length));
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
            }
            setInterval(draw, 33);
        }
    </script>
    <!-- Footer ke neeche aur </body> se pehle ye code paste karein -->
<script>
    // 1. Disable Right Click (Lekin text selection aur copy allow rahega)
    document.addEventListener('contextmenu', function(e) {
        // Agar user text select karke right click karega tab bhi block hoga, 
        // Isliye text copy karne ke liye unhe Ctrl+C use karna hoga.
        e.preventDefault();
    }, false);

    // 2. DevTools Block Karne ke Shortcuts
    document.onkeydown = function(e) {
        // F12 key block
        if (event.keyCode == 123) {
            return false;
        }
        // Ctrl+Shift+I (Inspect Element)
        if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) {
            return false;
        }
        // Ctrl+Shift+C (Inspect Element shortcut)
        if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) {
            return false;
        }
        // Ctrl+Shift+J (Console)
        if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) {
            return false;
        }
        // Ctrl+U (View Source Code)
        if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) {
            return false;
        }
    };

    // 3. DevTools Detection (Optional: Console open hote hi page khali ho jayega)
    // Note: Isse developer mode pakda jata hai.
    setInterval(function() {
        if (window.outerWidth - window.innerWidth > 160 || window.outerHeight - window.innerHeight > 160) {
            // Agar console side mein open ho
            console.clear();
        }
    }, 500);

    // 4. Image Dragging Allow (By default HTML allow karta hai, 
    // lekin hum ensure kar rahe hain ki koi script ise roke na)
    document.querySelectorAll('img').forEach(img => {
        img.addEventListener('dragstart', function(event) {
            // Dragging allow hai
        });
    });
</script>
</body>
</html>
